name: publish-dashboard

# =============================================================================
# 【R21 修订说明 —— 关于 if 里的 secrets（务必先读）】
# =============================================================================
# 【本次改了什么】
#   全文所有 `if:` 块里**不再出现任何 `secrets.*` 引用**（含被短路的）。
#   三个被关闭的可选步骤，统一改成最直白的形态：
#
#     - notify（微信推送）        if: false
#     - 私推 iptv-private        if: false
#     - 私推未启用说明            if: false
#
# 【为什么要这么改】
#   原来的写法是 `false && ... && secrets.PUSH_TOKEN != '' && ...`
#   （以及 `${{ secrets.PRIVATE_PAT != '' }}`）。语义上没问题 ——
#   短路确实保证了永不执行。但 **GitHub 网页编辑器会对 `if:` 里的
#   `secrets` 引用标红报错**，手机上逐行热修时很容易误判为"语法错"
#   而改坏其它地方。改成 `if: false` 后语义完全等价、且零标红。
#
# 【将来要怎么重新启用（重要 —— 不要直接删 if: false 就开）】
#   ❗ 由 **agent 用「job 级 env 注入」方案重开**，不要手动把 secrets
#     写回 `if:` 里 —— 那样又会触发编辑器标红。
#   正确思路：在 job 级或 step 级 `env:` 里注入一个普通变量，
#   `if:` 只引用该变量（env 里放 secrets 是合法且不标红的），例如：
#
#     jobs:
#       publish:
#         env:
#           HAS_PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
#         steps:
#           - if: env.HAS_PUSH_TOKEN != ''
#
#   本次**不做**这一步（推送与私推均已决定搁置），仅留说明。
#
# 【本次未受影响的逻辑（原样保留）】
#   - 双轨导出（gx_clean_hd.m3u / gx_full_305.m3u）
#   - artifact 上传（backup-gx-m3u，7 天）
#   - catchup 默认关（由 gx_epg_fetch.py 侧守卫，与本文件无关）
#   - 台标自检 / 冻结 / 双轨子集等断言（均在测试侧，与本文件无关）
# =============================================================================

# =============================================================================
# R14：日更迁移到 GitHub Actions，零长期 PAT
# =============================================================================
# 【触发方式】只保留定时与手动 —— **刻意不写 on: push**。
#   这是"防自我触发循环"的第一重保险：产物 push 到 gh-pages 时，即使
#   某些配置下触发了 workflow，也会被这里没有 push 触发器直接挡掉。
on:
  schedule:
    # cron 用 UTC。北京时间 08:00 = UTC 00:00。
    # ⚠️ GitHub 的 schedule 是"尽力而为"：高峰期可能有 5-15 分钟延迟，
    #    极端情况下甚至跳过某次。这是官方已知行为，不是配置错误。
    - cron: '0 0 * * *'
  workflow_dispatch:      # 手动触发：仓库 Actions 页 → 本 workflow → Run workflow
    # ---------------------------------------------------------------------
    # R20：手动导出备用源（Healer 死亡时的保险）
    # ---------------------------------------------------------------------
    # 【为什么用 input 开关而不是单独建一个 workflow 文件】
    #   两个原因：
    #   1. 用户的验收路径是「Actions → publish-dashboard → Run workflow」，
    #      一个页面勾一个框，比"去另一个 workflow 里找"少一次跳转。
    #   2. 单独的 workflow 文件意味着独立的权限配置、独立的缓存、
    #      独立的依赖安装 —— 多一份就多一处会腐坏的地方。
    #
    # 【默认 false —— 这是安全默认值】
    #   直接点 Run workflow（不勾任何框）= 跑一次普通的日更发布。
    #   只有显式勾上 export_backup，才会额外跑 export-backup Job。
    #   顺序反了（默认 true）会让每次手动跑日更都顺手生成一份含内网直链的
    #   artifact —— 那是**无意的泄漏面扩大**。
    inputs:
      export_backup:
        description: '导出备用源 backup_gx.m3u（仅走 artifact，7 天自动删）'
        type: boolean
        default: false

# 第二重保险：只用内置 GITHUB_TOKEN，不需要、也不使用任何长期 PAT。
# contents: write 是推送到 gh-pages 分支所必需的最小权限。
permissions:
  contents: write

# 防止两次运行重叠：前一次还没跑完时，新的一轮排队而非并发。
# cancel-in-progress: false —— 不打断进行中的发布（避免产生半截提交）。
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout 代码（main 分支）
        uses: actions/checkout@v4
        with:
          # 只 checkout main，**不** checkout gh-pages。
          # 产物分支由 publish_cloud.py 自己 fetch/创建，保持职责清晰。
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'          # 利用 GitHub 缓存加速依赖安装

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------------------------------
      # Step A：体检（探测公网源）
      # ---------------------------------------------------------------------
      # continue-on-error: true —— 探测失败也要继续发布。
      #   "全部源都挂了"本身就是一条**必须被发布的重要告警**，不能因为
      #   探针返回非零就中止流程（那等于把最该报的警吞掉了）。
      #   退出码仅用于让本步骤在 Actions 界面标红，便于人眼识别。
      - name: 体检（探测公网源）
        id: probe
        continue-on-error: true
        run: |
          python tools/probe_v4.py \
            --location cloud \
            -o report.json \
            --min-ok-list 1 \
            --per-host 4 \
            --timeout 8 \
            --total-timeout 180

      # 记录体检退出码，便于事后区分"体检挂"还是"发布挂"
      - name: 记录体检结果
        if: always()
        run: |
          echo "probe outcome = ${{ steps.probe.outcome }}"
          python tools/summarize_probe.py report.json

      # ---------------------------------------------------------------------
      # Step A2（R18）：EPG 取数 + 与 Healer 对比（上游死亡预警）
      # ---------------------------------------------------------------------
      # 【这一步在做什么】
      #   1. 拉官方 EPG 频道表（公网可达，实测 305 频道）
      #   2. 与 Healer gx.m3u 做 masked 对比（计数/交集/Jaccard）
      #   3. 偏离超阈值 → 说明"上游可能已死"，走告警链路
      #
      # 【为什么 continue-on-error: true】
      #   EPG 挂了不能阻断发布 —— 同 Step A 的哲学：
      #   "全挂了"本身就是一条必须被发布的告警。
      #   注意：这只对**取数**宽容；脱敏闸门（在 publish 内部）是**硬中断**，
      #   宁可发布失败也不泄漏。
      #
      # 【⚠️ 产物安全 —— 这一步产生两个文件，命运完全不同】
      #   epg_raw.json  ← **含内网直链**！只存在于 runner 临时目录，
      #                   绝不上传 artifact、绝不进仓库。运行结束即随 runner 销毁。
      #   epg_diff.json ← 已脱敏（只有计数），可上传 artifact、可进仓库。
      #   改动这一步时务必保持这个边界。
      - name: EPG 取数 + 与 Healer 对比（上游死亡预警）
        id: epg_diff
        continue-on-error: true
        run: |
          # 取数：--raw-urls 输出含直链，仅写 $RUNNER_TEMP（CI 内部用）
          python tools/gx_epg_fetch.py \
            --raw-urls "$RUNNER_TEMP/epg_raw.json" \
            --json "$RUNNER_TEMP/epg_masked.json" \
            --verbose || true

          # 对比：产出 masked 报告（无 URL / 无 host / 只有计数）
          python tools/epg_diff.py \
            --epg-raw "$RUNNER_TEMP/epg_raw.json" \
            --healer-url "https://gh-proxy.com/raw.githubusercontent.com/Healer-sys/Home/refs/heads/main/iptv/gx.m3u" \
            --history-dir "$HOME/gh-pages-worktree/epg/history" \
            --out "$RUNNER_TEMP/epg_diff.json" \
            --verbose || true

      # 记录对比结论（R-b 为 critical 时会在日志里显眼）
      - name: 记录 EPG 漂移结论
        if: always()
        run: |
          python tools/epg_diff.py --summary-of "$RUNNER_TEMP/epg_diff.json" || \
            echo "[epg] 无对比报告（取数或对比失败，不阻断发布）"

      # ---------------------------------------------------------------------
      # Step B：发布（脱敏 + 推 gh-pages）
      # ---------------------------------------------------------------------
      # 凭据用内置 GITHUB_TOKEN（由上面的 permissions 注入）。
      # R12b 脱敏闸门在这一步内部执行：命中直链特征串即抛异常中止推送。
      #
      # 【为什么固定用 $HOME/gh-pages-worktree】
      #   推送步骤（Step C）要读产物分支上的 status/latest.json，所以工作区
      #   路径必须在两个步骤之间保持一致且可预测。$RUNNER_TEMP 每步都可用，
      #   但写成 $HOME 下的固定名更直观、也便于人肉复现排查。
      #   --emit-notify-marker 让 publish_cloud 在「该推」时落一个标记文件，
      #   Step C 的 if 靠它判断 —— runner 上两个步骤共享同一个文件系统。
      - name: 发布到 gh-pages
        id: publish
        run: |
          python tools/publish_cloud.py \
            --report report.json \
            --repo "$HOME/gh-pages-worktree" \
            --remote "https://github.com/${{ github.repository }}.git" \
            --branch gh-pages \
            --dashboard-html index.html \
            --epg-diff "$RUNNER_TEMP/epg_diff.json" \
            --emit-notify-marker "$RUNNER_TEMP/notify_pending.json" \
            --push
        env:
          # 显式传入内置 token。publish_cloud.py 的凭据优先级是
          # GITHUB_TOKEN > GITHUB_PAT，所以这里设 GITHUB_TOKEN 即可。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 把标记文件与 Pages 地址暴露给后续步骤
      - name: 计算 Pages 地址与推送标记
        id: pages_url
        if: always()
        run: |
          echo "pages_url=https://${{ github.repository_owner }}.github.io/${{
            github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          if [ -f "$RUNNER_TEMP/notify_pending.json" ]; then
            echo "notify_pending=$(cat "$RUNNER_TEMP/notify_pending.json")" >> "$GITHUB_OUTPUT"
            # 复制进工作区，让 hashFiles() 在 Step C 的 if 里能看见
            mkdir -p spool
            cp "$RUNNER_TEMP/notify_pending.json" spool/notify_pending.json
          else
            echo "notify_pending=" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------------
      # Step C：微信推送（可选，当前显式关闭）
      # ---------------------------------------------------------------------
      # 【当前状态：关闭，形态为 `if: false`】
      #   整个步骤被 `if: false` 硬关（见下方 R21 修订说明）。
      #   Actions 页面能看到这个 step，但永远是 skipped —— 不产生噪音。
      #
      # 【为什么放在 publish 之后】
      #   推送的内容来自 status/latest.json —— 那是 publish 步骤的产物。
      #   顺序反了就只能推上一次的数据。
      #
      # 【continue-on-error: true】
      #   推送失败**绝不能**阻断发布。发布是资产（看板 + 归档），推送只是通知；
      #   因为推送接口抖了一下就丢掉当天的数据，是本末倒置。
      #   失败会计入 status 的 push_failures，留痕但不阻断。
      #
      # 【enable 时需要的条件（供将来参考）】
      #   1. 有 PUSH_TOKEN（PushPlus 的 32 位 token）—— 放 Secrets
      #   2. 状态机判定 send=true（新告警 / 恢复 / 早报）—— 避免重复轰炸
      #   3. always() —— 即使 publish 挂了也要能报警
      #   4. 早报开关：仓库变量 IPTV_DAILY_REPORT=1（用 vars 而非 secrets，
      #      它不是敏感信息，且需要在 if 里可读）
      #
      # 【R21 修订：为什么改成 `if: false`（重要）】
      #   R20.1 时这里写的是 `false && always() && secrets.PUSH_TOKEN != '' && ...`。
      #   短路确实保证了"永不执行"，语义没问题。但 **`secrets.*` 出现在
      #   `if:` 里会被 GitHub 网页编辑器标红报错** —— 手机上逐行热修时
      #   极易误判为"语法错误"而改坏别处。
      #   改成 `if: false` 后：语义完全等价（永不执行），且 `if:` 零 secrets、
      #   编辑器零标红。
      #
      #   ⚠️ **将来要启用：不要直接把 secrets 写回 if，也不要只删掉这一行。**
      #      正确方式是由 agent 用**「job 级 env 注入」**方案重开：
      #        jobs.publish.env:
      #          HAS_PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
      #        step 的 if: env.HAS_PUSH_TOKEN != ''
      #      env 里放 secrets 是合法且不标红的，if 只引用普通变量名。
      #      完整说明见本文件头。
      - name: 微信推送（已关闭：if false；启用方式见文件头）
        id: notify
        continue-on-error: true
        if: false
        run: |
          python tools/notify_push.py \
            --status "$HOME/gh-pages-worktree/status/latest.json" \
            --report report.json \
            --pages-url "${{ steps.pages_url.outputs.pages_url }}"
        env:
          # 凭据走 Secrets，代码零字面量。
          # （放在 env 里不标红；被 if 挡住时这行不会执行。）
          PUSHPLUS_TOKEN: ${{ secrets.PUSH_TOKEN }}

      # ---------------------------------------------------------------------
      # Step D：保留体检原始报告（便于排查）
      # ---------------------------------------------------------------------
      # ⚠️ 只上传 report.json 与 **已脱敏** 的 epg_diff.json。
      #    epg_raw.json（含内网直链）**绝不上传** —— 即便它只是 artifact，
      #    上传后也会长期留在 GitHub 上，等同泄漏。
      #    并且：artifact 是"排查面"，**不是发布面** —— 看板与仓库只吃 gh-pages 产物。
      - name: 上传体检报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-report
          path: |
            report.json
            ${{ runner.temp }}/epg_diff.json
          retention-days: 7
          if-no-files-found: warn

  # ===========================================================================
  # R20/R21：export-backup —— Healer 死亡时的备用源导出
  # ===========================================================================
  # 【这是什么】
  #   把官方 EPG 的 305 条内网直链导出成双轨 m3u（带 UA 头 + 频道图标），
  #   作为 Healer gx.m3u 失效时的保险。R21 起产物为两份：
  #     gx_clean_hd.m3u  —— 精简高清轨（剔标清/低码率/测试台）
  #     gx_full_305.m3u  —— 全集轨（原样全量，数据完整性基准）
  #
  # 【与 publish Job 的三重物理隔离 —— 这是本 Job 最重要的设计约束】
  #   1. **独立 Job**：不是 publish 里的一个 step。job 之间不共享工作区，
  #      publish 推 gh-pages 的一切副作用都到不了这里。
  #   2. **不 checkout gh-pages**：只 checkout main（下面的 checkout 步骤
  #      明确写死 ref: main），连产物分支的引用都没有，无法误推。
  #   3. **不 commit / 不 push 到本库**：全 Job 对本仓库只有 1 个
  #      upload-artifact 出口，**没有任何指向本库的 git push**。
  #      （R21 新增的私有库推送指向**另一个仓库** iptv-private，
  #        见下方说明 —— 它不碰本库任何分支，尤其不碰 gh-pages。）
  #
  # 【为什么必须隔离到这种程度】
  #   产物 **含内网直链**（cdnrrs.gx.chinamobile.com/...）。
  #   它一旦进 gh-pages（公开 Pages），就等于把用户家的网络拓扑图挂在网上。
  #   接口泄露是"上游改一个 URL 就能修"的运维问题，而**泄漏是招来 DDoS
  #   和封禁的资产问题**。两类风险不对等，所以隔离要做到结构性、而非纪律性。
  #
  # ---------------------------------------------------------------------------
  # 【R21 第 4 项：免手动下载 —— 改走私有库 iptv-private】
  # ---------------------------------------------------------------------------
  # 【为什么 artifact 不够】
  #   artifact 需要"登录 GitHub + 进 Actions 页面 + 找到 run + 下载解压"，
  #   手机上极不方便。而产物又是 7 天过期的 —— 每次想用都得现去下载。
  #
  # 【为什么不是"公开一下就好"】
  #   产物含内网直链，**绝不能进任何公开面**（R12b 红线，不因便利性让步）。
  #   所以走**新建的私有库** iptv-private：私有库的可见性 == 你一个人，
  #   且 git clone 一次之后本地就有，不必每天去 Actions 页面捞。
  #
  # 【跨库凭据：一枚只读 fine-grained PAT】
  #   - 类型：fine-grained personal access token
  #   - 权限：只授予 iptv-private 的 **Contents: Read and write**
  #           （写是必须的 —— 要往里推文件；范围**仅限这一个库**）
  #   - 存放：本仓库 Secrets 里的 PRIVATE_PAT
  #   - 轮换：**90 天**（fine-grained PAT 可设有效期，到期必须换）
  #           README 里也写明了这一点，避免过期后无声失效。
  #
  # 【未配 PAT 时的行为 —— 双路径并存、默认安全】
  #   设计意图：没配 PRIVATE_PAT 时私推步骤被跳过，Job 照常产出 artifact，
  #   你仍可手动下载。**功能不会坏，只是没走便捷通道。**
  #   便捷通道是"锦上添花"，不能成为"没有它就出事"的依赖。
  #
  #   ❗【当前实际状态】私推步骤是 `if: false`（**硬关，不是"等 PAT"**）。
  #     原因：引入 90 天长期 PAT 与本项目"零长期凭据"的既定架构冲突，
  #     且 artifact 手动下载对"战时备用"定位已足够。属搁置的 DLC。
  #     将来启用由 agent 用 job 级 env 注入方案重开（见文件头）。
  #
  # 【触发条件为什么写成这样】
  #   github.event_name == 'workflow_dispatch'  —— schedule 触发时
  #     github.event.inputs 不存在，这个条件直接为假，定时任务绝不会
  #     顺手生成含直链的 artifact。
  #   github.event.inputs.export_backup == 'true'  —— boolean input 在
  #     event.inputs 里是**字符串** 'true'/'false'（不是布尔），
  #     写成 `== true` 会永远不成立。这个坑实测踩过。
  export-backup:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.export_backup == 'true'
    runs-on: ubuntu-latest
    # 超时给足：EPG 取数 + 双轨写入 + 私有推送，正常 1-2 分钟内完成，
    # 但接口慢时要留余量（这是手动触发的兜底任务，宁可慢也别失败）。
    timeout-minutes: 15

    steps:
      - name: Checkout 代码（main 分支，**不碰** gh-pages）
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 【为什么要单独装 pypinyin】
          #   R21 后台标主线是直采 channelIcon；Gitee 兜底通道的拼音候选
          #   （"安徽卫视" → ANHUI）仍依赖 pypinyin。
          #   它是**可选**依赖：缺失时兜底降级（少些图标）但绝不失败。
          pip install -r requirements.txt
          pip install pypinyin==0.55.0

      - name: 导出双轨备用源 m3u
        run: |
          # 产物写到 $RUNNER_TEMP（**不是工作区**），从源头避免被
          # 后续任何 checkout/commit 步骤扫到。
          # --tracks 一次产出 gx_clean_hd.m3u + gx_full_305.m3u（同一快照）。
          # --logo-stats 输出台标命中率 JSON，供下面的自检读取。
          python tools/gx_epg_fetch.py \
            --tracks "$RUNNER_TEMP/tracks" \
            --logo-stats "$RUNNER_TEMP/logo_stats.json" \
            --verbose

          # 【自检】空列表或格式不对就直接失败，别让用户下到坏文件。
          # 这是"产物质量闸门"：宁可 Job 标红，也不交付打不开的 m3u。
          # 【R21 新增两条】
          #   ① 双层命中率：硬线 <0.60 => 失败（上游字段突变防线）；
          #      软线 <0.75 => 只告警不失败（第三方抖动不拦发布）。
          #   ② 双轨套件默认**绝不含** catchup 字段（防误开）。
          python - "$RUNNER_TEMP/tracks" "$RUNNER_TEMP/logo_stats.json" <<'PY'
          import json, os, sys
          tdir, statp = sys.argv[1], sys.argv[2]
          clean = open(os.path.join(tdir, "gx_clean_hd.m3u"), encoding="utf-8").read()
          full = open(os.path.join(tdir, "gx_full_305.m3u"), encoding="utf-8").read()

          for name, txt in (("gx_clean_hd", clean), ("gx_full_305", full)):
              lines = txt.splitlines()
              assert lines and lines[0] == "#EXTM3U", f"{name} 缺 #EXTM3U 头"
              assert "dalvik/2.1.0" in txt.lower(), f"{name} 缺 UA 头"
              n = sum(1 for l in lines if l.startswith("#EXTINF"))
              assert n >= 1, f"{name} 没有任何频道"
              assert "servicetype=1" in txt, f"{name} 直链形态不对"
              # R21 防误开：默认模式绝不出现 catchup/playseek 字样
              low = txt.lower()
              assert "playseek" not in low and "catchup" not in low, \
                  f"{name} 默认模式却含 catchup 字段（开关被误开？）"
              print(f"[OK] {name}: {n} 条")

          st = json.load(open(statp, encoding="utf-8"))
          print(f"[i] 台标 direct={st['direct']} fallback={st['fallback']} "
                f"total={st['total']}")
          print(f"[i] direct_logo_rate={st['direct_logo_rate']} "
                f"combined_logo_rate={st['combined_logo_rate']}")
          # 硬线：失败即 Job 红（守住上游 channelIcon 字段突变）
          assert st["direct_ok"], (
              f"硬线未达标：direct_logo_rate={st['direct_logo_rate']} < 0.60，"
              "疑似上游 channelIcon 字段被削，请核查 EPG 返回结构")
          # 软线：只告警，绝不阻断发布
          if not st["combined_ok"]:
              print(f"[!] 软线告警：combined_logo_rate="
                    f"{st['combined_logo_rate']} < 0.75（不拦发布）")
          print("[OK] 双轨产物自检通过")
          PY

      - name: 上传备用源（artifact —— 7 天自动删，不进仓库）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-gx-m3u
          # [R21] 双轨两个文件。**仍然只点名具体文件，绝不上传目录** ——
          #   上传 `path: .` 或整个 tracks/ 会让中间产物被打包。
          path: |
            ${{ runner.temp }}/tracks/gx_clean_hd.m3u
            ${{ runner.temp }}/tracks/gx_full_305.m3u
            ${{ runner.temp }}/logo_stats.json
          retention-days: 7
          if-no-files-found: error

      # -----------------------------------------------------------------------
      # R21：推送到私有库 iptv-private（免手动下载）
      # -----------------------------------------------------------------------
      # 【安全边界 —— 逐步说明】
      #   1. 目标仓库是**另一个**仓库（iptv-private），不是本仓库。
      #      **不碰本仓库任何分支，尤其不碰 gh-pages。**
      #   2. 凭据用 Secrets 里的 PRIVATE_PAT（fine-grained，仅读写在
      #      iptv-private）。代码里零字面量 token。
      #   3. token 通过 URL 传给 git 的做法会把它写进 .git/config，
      #      这里用 `git remote set-url` 在 push 前设置、push 后立刻清除，
      #      且**只推一个 commit**（--depth 1），把暴露窗口压到最小。
      #   4. 未配 PAT => 本步骤被 if 跳过 => 退回 artifact 手动下载。
      #      **双路径并存、默认安全。**
      #
      # 【R21 修订：if 里不再出现 secrets —— 见文件头说明】
      #   原来写的是 `if: ${{ secrets.PRIVATE_PAT != '' }}`。
      #   语义没问题，但 `secrets.*` 在 `if:` 里会让网页编辑器标红，
      #   手机端改动易出错。现在**直接 `if: false`**（永不执行），
      #   `if:` 块零 secrets、零标红。
      #   将来要启用：由 agent 用 job 级 env 注入方案重开（见文件头）。
      - name: 推送到私有库 iptv-private（已关闭：if false）
        if: false
        continue-on-error: true
        env:
          # 私有库名字，想换库只改这一处。
          PRIVATE_REPO: iptv-private
          PRIVATE_PAT: ${{ secrets.PRIVATE_PAT }}
        run: |
          set -euo pipefail
          TARGET="https://x-access-token:${PRIVATE_PAT}@github.com/${{ github.repository_owner }}/${PRIVATE_REPO}.git"
          WORK="$RUNNER_TEMP/private-push"
          rm -rf "$WORK"; mkdir -p "$WORK"

          # 先试 clone；空库/新库 clone 会失败，那就 init 一个。
          if ! git clone --depth 1 "$TARGET" "$WORK" 2>/dev/null; then
            echo "[i] 私有库为空或不存在，初始化为新仓库"
            git -C "$WORK" init -q
            git -C "$WORK" remote add origin "$TARGET"
          fi

          # 【为什么要分目录】产物按日期归档，方便你回溯"某天的源长什么样"，
          #   而不是每次覆盖 —— 覆盖会丢掉"源何时变了"这条线索。
          DEST="$WORK/$(date -u +%Y-%m-%d)"
          mkdir -p "$DEST"
          cp "$RUNNER_TEMP/tracks/gx_clean_hd.m3u" "$DEST/"
          cp "$RUNNER_TEMP/tracks/gx_full_305.m3u" "$DEST/"
          cp "$RUNNER_TEMP/logo_stats.json" "$DEST/"
          # 最新一份另放 latest/，方便固定路径直接取用
          mkdir -p "$WORK/latest"
          cp "$RUNNER_TEMP/tracks/gx_clean_hd.m3u" "$WORK/latest/"
          cp "$RUNNER_TEMP/tracks/gx_full_305.m3u" "$WORK/latest/"

          git -C "$WORK" config user.name  "github-actions[bot]"
          git -C "$WORK" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$WORK" add -A
          if git -C "$WORK" diff --cached --quiet; then
            echo "[i] 内容无变化，跳过提交"
          else
            git -C "$WORK" commit -q -m "chore: 更新双轨备用源 $(date -u +%Y-%m-%d)"
            git -C "$WORK" push -q origin HEAD:main || \
              git -C "$WORK" push -q origin HEAD:master
            echo "[OK] 已推送到 ${PRIVATE_REPO}"
          fi
          # 【立刻清除凭据】避免残留在 .git/config 里
          git -C "$WORK" remote set-url origin \
            "https://github.com/${{ github.repository_owner }}/${PRIVATE_REPO}.git"

      # 未配 PAT 时的显式提示（让人知道产物在哪、怎么配便捷通道）
      # 【R21 修订：if 里不再出现 secrets —— 见文件头说明】
      #   原来写的是 `if: ${{ secrets.PRIVATE_PAT == '' }}`（未配 PAT 时提示）。
      #   现在**直接 `if: false`** —— 关掉私推后这条提示也无意义了
      #   （没开私推，自然不需要提示怎么配）。
      #   将来启用私推时，这条提示由 agent 用 env 方案一并重开（见文件头）。
      - name: 私有推送未启用时的说明（已关闭：if false）
        if: false
        run: |
          echo "[i] 未配置 PRIVATE_PAT —— 已跳过私有库推送。"
          echo "    产物仍可在本 run 的 Artifacts 里下载（7 天内有效）。"
          echo "    想启用免手动下载：新建私有库 iptv-private，"
          echo "    并添加 Secrets.PRIVATE_PAT（fine-grained，仅该库 Contents 读写，90 天轮换）。"
