姓名: 发布仪表板

#=============================================================================
#R14：日更迁移到GitHub Actions，零长期PAT
#=============================================================================
#【触发方式】只保留定时与手动--**刻意不写开：按**。
#这是"防自我触发循环"的第一重保险：产物push到gh-pages时，即使
#某些配置下触发了workflow，也会被这里没有push触发器直接挡掉.
在……之上:
计划表:
    #cron用UTC.北京时间08:00=UTC 00:00。
    # ⚠️    GitHub的计划表是"尽力而为"：高峰期可能有5-15分钟延迟，
    #    极端情况下甚至跳过某次。这是官方已知行为，不是配置错误。
    - 克朗: '0 0 * * *'
workflow_dispatch:      #手动触发：仓库行动页→本工作流→运行工作流

#第二重保险：只用内置GitHub_TOKEN，不需要、也不使用任何长期PAT。
#contents:write是推送到gh-pages分支所必需的最小权限。
权限:
内容: 写

# 防止两次运行重叠：前一次还没跑完时，新的一轮排队而非并发。
#cancel-in-progress:false--不打断进行中的发布（避免产生半截提交）。
并发性:
组: 出版
正在取消: 假的

工作:
出版:
连续的: Ubuntu-最新
timeout-minutes: 20

步骤:
      - 姓名: checkout代码(main分支)
uses: 操作/结帐@v4
和……一起:
          #只checkout main，**不**checkout gh-pages。
          #产品分支由publish_cloud.py自己取来/创建，保持职责清晰。
裁判: 主要的
提取深度: 1

      - 姓名: 设置python
uses: 操作/setup-python@v5
和……一起:
Python版: '3.11'
缓存: 'Pip'          #利用github松动加速依赖安装

      - 姓名: 安装依赖
跑: |
Python-m pip安装--升级pip
PIP安装-r要求.文本

      #---------------------------------------------------------------------
      #步骤A：体检（探测公网源）
      #---------------------------------------------------------------------
      #continue-on-error:true--探测失败也要继续发布。
      #   "全部源都挂了"本身就是一条**必须被发布的重要告警**，不能因为
      #   探针返回非零就中止流程（那等于把最该报的警吞掉了）。
      #退出码仅用于让本步骤在行动界面标红，便于人眼识别。
      - 姓名: 体检（探测公网源）
身份标识: 探针
出错时继续: 正确
跑: |
Python工具/probe_v4.py\
--location cloud\
-o report.json\
--min-ok-list1\
--每主机4\
--超时8\
--总超时180

      # 记录体检退出码，便于事后区分"体检挂"还是"发布挂"
      - 姓名: 记录体检结果
如果: 总是()
跑: |
回声"探测结果=${{steps.probe.outcome}}"
Python工具/summary_probe.py report.json

      #---------------------------------------------------------------------
      #步骤B：发布（脱敏+推gh-pages)
      #---------------------------------------------------------------------
      #凭据用内置GitHub_TOKEN（由上面的权限注入）。
      # R12b 脱敏闸门在这一步内部执行：命中直链特征串即抛异常中止推送。
      #
      #【为什么固定用$home/gh-pages-worktree]
      #推送步骤(步骤C)要读产物分支上的status/latest.json，所以工作区
      #   路径必须在两个步骤之间保持一致且可预测。$RUNNER_TEMP 每步都可用，
      #   但写成 $HOME 下的固定名更直观、也便于人肉复现排查。
      #--emit-notify-marker让发布云(_C)在“该推”时落一个标记文件，
      #步骤C的if靠它判断--跑步者上两个步骤共享同一个文件系统.
      - 姓名: 发布到gh-pages
身份标识: 出版
跑: |
Python工具/publish_cloud.py\
            --report report.json \
--repo"$HOME/gh-pages-worktree"\
--远程"https://github.com/${{github.Repository}}.git"\
--branch gh-pages\
--dashboard-html index.html\
--emit-notify-marker"$RUNNER_TEMP/notify_pending.json"\
--推
env:
          #显式传入内置token.publish_cloud.py的凭据优先级是
          #GITHUB_TOKEN>GITHUB_PAT，所以这里设GitHub_TOKEN即可.
GitHub_TOKEN: ${{secrets.GITHUB_TOKEN}}

      # 把标记文件与 Pages 地址暴露给后续步骤
      - 姓名: 计算 Pages 地址与推送标记
身份标识: pages_url
如果: 总是()
跑: |
回声"pages_url=https://${{github.repository_owner}}.github.io/${{
github.event.repository.name}}/">>"$GITHUB_OUTPUT"
如果[-f"$RUNNER_TEMP/notify_pending.json"]；则
回声"notify_pending=$(cat"$RUNNER_TEMP/notify_pending.json")">>"$GITHUB_OUTPUT"
#复制进工作区，让hashfiles()在步骤C的if里能看见
mkdir-p阀芯
CP"$RUNNER_TEMP/notify_pending.json"spool/notify_pending.json
其他
回声"notify_pending=">>"$GITHUB_OUTPUT"
Fi

      #---------------------------------------------------------------------
      #步骤C：微信推送(R16)
      #---------------------------------------------------------------------
      #【为什么放在出版之后】
      #推送的内容来自status/latest.json--那是出版步骤的产物。
      #   顺序反了就只能推上一次的数据。
      #
      # 【continue-on-error: true —— R16-4】
      #   推送失败**绝不能**阻断发布。 发布是资产（看板 + 归档），推送只是通知；
      #   因为微信接口抖了一下就丢掉当天的数据，是本末倒置。
      #失败会计入状态的push_failures，留痕但不阻断。
      #
      #[if条件]
      #读出版刚写出的status/latest.json，只在通知状态机判定send=true
      #时才真正推送（首次告警/恢复/早报）。状态机在publish_cloud.py里，
      #   这里只消费它的结论 —— 避免两处各判一次导致口径漂移。
      #
      #
      #想开早报：把下面的vars.IPTV_DAILY_REPORT改成'1'
      #(设置→变量→操作→新建存储库变量)。
      #用vars而不是secret：它不是敏感信息，且需要在if里可读.
      - 姓名: 微信推送（仅状态翻转时）
身份标识: 通知
出错时继续: 正确
如果: >-
总是()&&
(vars.IPTV_DAILY_REPORT=='1'||
哈希文件('spool/notify_pending.json') !='')
跑: |
Python工具/notify_push.py\
--状态"$HOME/gh-pages-worktree/status/latest.json"\
            --report report.json \
--pages-url"${{steps.pages_url.outputs.pages_url}}"
env:
          # 凭据走 Secrets，代码零字面量。未配置时脚本静默跳过（不算失败）。
PUSHPLUS_TOKEN: ${{secrets.PUSH_TOKEN}}
      #---------------------------------------------------------------------
      # Step D：保留体检原始报告（便于排查）
      #---------------------------------------------------------------------
      - 姓名: 上传体检报告
如果: 总是()
uses: 操作/上载工件@v4
和……一起:
姓名: 探针报告
路径: report.json
保留天数: 7
if-no-file-found: 警告
